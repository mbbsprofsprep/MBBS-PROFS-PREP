<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <title id="dynamic-page-title">MBBS Profs Prep - Clinical Cases</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50:'#f0f9ff', 100:'#e0f2fe', 200:'#bae6fd', 400:'#3395ff', 500:'#0ea5e9', 600:'#0284c7', 900:'#0c4a6e' },
                        accent: { yellow: '#ffc107', yellowHover: '#e0a800' },
                        dark: { bg: '#020617', surface: '#0f172a', border: '#1e293b' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        };
    </script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden; }
        body { background-color: #f0f9ff; color: #0f172a; transition: background-color 0.3s ease, color 0.3s ease; }
        html.dark body { background-color: #020617 !important; color: #f8fafc !important; }
        .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border: 1px solid #e0f2fe; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        html.dark .glass-card { background: rgba(15,23,42,0.9); border: 1px solid #1e293b; color: #f1f5f9; }
        .correct-option { font-weight: 400; }
        body.show-answers .correct-option { font-weight: 700; color: #15803d; background: #dcfce7; padding: 2px 6px; border-radius: 4px; border: 1px solid #22c55e; }
        html.dark body.show-answers .correct-option { color: #4ade80; background: rgba(34,197,94,0.2); border-color: #15803d; }
        .theory-question { font-style: italic; color: #0284c7; font-weight: 500; background: #f0f9ff; padding: 16px; border-radius: 8px; border-left: 4px solid #3395ff; line-height: 1.6; }
        html.dark .theory-question { background: rgba(15,23,42,0.8); color: #bae6fd; border-left-color: #0ea5e9; }
        .multiselect-container { position: relative; }
        .multiselect-btn { text-align: left; width: 100%; background: #fff; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.7rem 0.9rem; font-size: 0.85rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        html.dark .multiselect-btn { background: #0f172a; border-color: #1e293b; color: #e5e7eb; }
        .multiselect-menu { display: none; position: absolute; z-index: 50; top: 100%; left: 0; right: 0; margin-top: 0.25rem; background: #fff; border: 1px solid #e2e8f0; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-height: 280px; overflow-y: auto; }
        .multiselect-menu.show { display: block; }
        html.dark .multiselect-menu { background: #0f172a; border-color: #1e293b; }
        .multiselect-option { padding: 0.5rem 0.85rem; cursor: pointer; display: flex; align-items: center; font-size: 0.82rem; gap: 0.6rem; color: #334155; }
        html.dark .multiselect-option { color: #cbd5e1; }
        .multiselect-option:hover { background: #f0f9ff; }
        html.dark .multiselect-option:hover { background: #1e293b; }
        #universal-deck-layer { display: none; position: fixed; inset: 0; width: 100%; height: 100vh; background: #f8fafc; z-index: 9990; flex-direction: column; }
        html.dark #universal-deck-layer { background: #020617; color: #fff; }
        .deck-card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); height: 100%; overflow-y: auto; display: flex; flex-direction: column; }
        html.dark .deck-card { background: #0f172a; border: 1px solid #1e293b; }
        .deck-option-btn { width: 100%; padding: 14px; margin-bottom: 10px; border: 2px solid #e2e8f0; border-radius: 12px; text-align: left; font-weight: 500; cursor: pointer; background: #fff; color: #334155; }
        html.dark .deck-option-btn { border-color: #1e293b; background: rgba(30,41,59,0.5); color: #cbd5e1; }
        .deck-opt-correct { border-color: #22c55e !important; background: #f0fdf4 !important; color: #15803d !important; font-weight: 700; }
        html.dark .deck-opt-correct { background: rgba(34,197,94,0.15) !important; color: #4ade80 !important; }
        .deck-opt-wrong { border-color: #ef4444 !important; background: #fef2f2 !important; color: #b91c1c !important; font-weight: 700; opacity: 0.8; }
        html.dark .deck-opt-wrong { background: rgba(239,68,68,0.15) !important; color: #f87171 !important; }
        #view-toggle-btn { position: fixed; bottom: 24px; right: 24px; z-index: 10000; width: 58px; height: 58px; border-radius: 50%; background: #0ea5e9; color: #fff; box-shadow: 0 4px 15px rgba(14,165,233,0.4); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 26px; }
        .deck-drawer { position: fixed; inset: 0; z-index: 10001; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
        .deck-drawer.open { pointer-events: auto; opacity: 1; }
        .deck-drawer-bg { position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
        .deck-drawer-content { position: absolute; top: 0; right: 0; bottom: 0; width: 85%; max-width: 320px; background: #fff; transform: translateX(100%); transition: transform 0.25s; display: flex; flex-direction: column; }
        html.dark .deck-drawer-content { background: #0f172a; border-left: 1px solid #1e293b; }
        .deck-drawer.open .deck-drawer-content { transform: translateX(0); }
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 16px; overflow-y: auto; }
        .deck-nav-btn { position: relative; aspect-ratio: 1; border-radius: 8px; font-weight: 700; font-size: 11px; background: #f3f4f6; color: #1e293b; border: 1px solid #cbd5e1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        html.dark .deck-nav-btn { background: #1e293b; color: #f1f5f9; border-color: #334155; }
        .deck-nav-btn.active { background: #0ea5e9 !important; color: #fff !important; border-color: #0ea5e9 !important; }
        .deck-nav-btn.correct { background: #22c55e; color: #fff; border-color: #16a34a; }
        .deck-nav-btn.wrong { background: #ef4444; color: #fff; border-color: #dc2626; }
        .sortable-ghost { opacity: 0.4; background: #e0f2fe; }
    </style>
</head>
<body class="bg-brand-50 dark:bg-dark-bg transition-colors duration-300 relative flex flex-col min-h-screen">

    <div class="w-full px-4 pt-24 pb-12 max-w-7xl mx-auto flex-1" id="main-wrapper">
        <header class="text-center mb-8 relative">
            <h1 class="text-3xl md:text-5xl font-extrabold text-brand-600 dark:text-brand-400 tracking-tight mb-1" id="dynamic-subject-title">Clinical Cases</h1>
            <h2 class="text-lg md:text-xl font-semibold text-brand-500 dark:text-brand-300" id="dynamic-college-header">MBBS PROFS PREP</h2>
            <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Live Clinical Database &amp; Ward Scenarios.</p>

            <!-- ADMIN-ONLY TOOLBAR (Invisible to students; populated by js/admin-suite.js) -->
            <div id="admin-controls" class="hidden mt-4 justify-center items-center gap-2.5 bg-white dark:bg-slate-800 px-4 py-2 rounded-xl border border-brand-200 dark:border-brand-800 shadow-sm inline-flex flex-wrap">
                <span class="text-[10px] font-black text-brand-700 dark:text-brand-400 uppercase tracking-widest">Student Answers</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="global-answer-toggle" class="sr-only peer" onchange="window.toggleGlobalAnswers?.()">
                    <div class="w-9 h-5 bg-slate-300 dark:bg-slate-600 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-500"></div>
                </label>
            </div>
        </header>

        <!-- UNIFIED FILTER BAR -->
        <div class="glass-card p-5 rounded-xl mb-6 relative z-40">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
                <div class="md:col-span-4 flex items-center gap-2">
                    <input type="text" id="searchInput" oninput="window.QBankEngine.setSearch(this.value)" placeholder="Search clinical cases, topics..." class="w-full px-3.5 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-dark-surface text-slate-900 dark:text-white text-sm outline-none focus:ring-2 focus:ring-brand-500">
                    <button type="button" id="btn-filter-saved" onclick="window.QBankEngine.toggleSavedFilter()" class="px-3.5 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-dark-surface text-slate-600 dark:text-slate-300 font-bold text-xs flex items-center gap-1.5 shrink-0 cursor-pointer" title="Saved Only">
                        <span>🔖</span><span class="hidden sm:inline">Saved</span>
                    </button>
                    <button type="button" id="summaryButton" onclick="window.handleSecretClick?.()" style="display:none;" class="text-xl bg-transparent border-none cursor-pointer" title="Admin Quick Codes">☕</button>
                </div>
                <div class="md:col-span-2">
                    <select id="attemptFilterSelect" onchange="window.QBankEngine.setAttemptFilter(this.value)" class="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-dark-surface text-slate-700 dark:text-slate-200 text-xs font-bold outline-none">
                        <option value="all">All Status</option>
                        <option value="unsolved">Unsolved</option>
                        <option value="correct">Correct</option>
                        <option value="wrong">Wrong</option>
                    </select>
                </div>
                <div class="md:col-span-2" id="typeFilterWrapper"></div>
                <div class="md:col-span-2" id="chapterFilterWrapper"></div>
                <div class="md:col-span-2" id="examFilterWrapper"></div>
            </div>
        </div>

        <!-- CLINICAL TABLE -->
        <div class="overflow-hidden rounded-xl shadow-lg border border-slate-200 dark:border-slate-800 glass-card relative z-10">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-800" id="qnaTable">
                    <thead class="bg-brand-500 dark:bg-dark-surface border-b dark:border-slate-700">
                        <tr>
                            <th class="px-4 py-4 text-center text-xs font-bold text-white uppercase w-24">Case ID</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-white uppercase min-w-[340px]">Clinical Scenario</th>
                            <th class="px-4 py-4 text-center text-xs font-bold text-white uppercase min-w-[90px]">Format</th>
                            <th class="px-4 py-4 text-left text-xs font-bold text-white uppercase min-w-[180px]">System &amp; Topic</th>
                            <th class="px-4 py-4 text-left text-xs font-bold text-white uppercase min-w-[140px]">Source</th>
                            <th class="px-4 py-4 text-center text-xs font-bold text-white uppercase w-24">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200 dark:divide-slate-800 text-sm bg-white dark:bg-dark-bg text-slate-900 dark:text-slate-200"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- CASE NOTES MODAL (Read-Only for Students; Visual Editor for 3 Admins) -->
    <div id="answerModal" class="fixed inset-0 z-[32000] hidden overflow-y-auto">
        <div class="fixed inset-0 bg-slate-900/75 backdrop-blur-sm" onclick="window.QBankEngine.closeAnswerModal()"></div>
        <div class="flex min-h-full items-center justify-center p-4">
            <div class="relative w-full max-w-5xl rounded-2xl bg-slate-50 dark:bg-dark-surface text-left shadow-2xl border border-slate-200 dark:border-slate-700 flex flex-col max-h-[90vh] overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-white dark:bg-slate-900 shrink-0">
                    <h3 class="text-lg font-black text-slate-900 dark:text-white m-0">📝 Case Notes &amp; Management</h3>
                    <button type="button" onclick="window.QBankEngine.closeAnswerModal()" class="text-slate-400 hover:text-red-500 bg-transparent border-none text-xl font-bold cursor-pointer">✕</button>
                </div>
                <div id="ans-modal-body" class="p-4 md:p-6 overflow-y-auto flex-1 bg-slate-50 dark:bg-dark-bg"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { bootQBankEngine } from "./js/qbank-engine.js";
        bootQBankEngine({ mode: "clinical" });
    </script>
</body>
</html>
