<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgFbo8CVZSf-ejwVGTTTGeu1B5bJj4JGloqdh70o21Tf_895kWYOvNmyE9cnAAR66r77ZFZZKTslF6QIp4F-bWxPsXjGsAWzwc75D6VnXqFMbi-4NgUazELmmMWeyX3ApASZncrHUFjni62u4spE3g19Pfcbsy-h5iUTfxTXWWTEYPgaD47kLMDA43e1SMQ/s678/1000126459.jpg">
    <title>MBBS Profs Prep - Central Portal</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50:'#f0f9ff', 100:'#e0f2fe', 200:'#bae6fd', 400:'#3395ff', 500:'#0ea5e9', 600:'#0284c7', 900:'#0c4a6e' },
                        accent: { yellow: '#ffc107', yellowHover: '#e0a800' },
                        dark: { bg: '#020617', surface: '#0f172a', border: '#1e293b' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out forwards' },
                    keyframes: { fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } }
                }
            }
        };
    </script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden; }
        body { background-color: #f0f9ff; color: #0f172a; transition: background-color 0.3s ease, color 0.3s ease; }
        html.dark body { background-color: #020617 !important; color: #f8fafc !important; }
        #canvas-container { position: fixed; inset: 0; z-index: 0; pointer-events: none; transition: opacity 0.5s ease; }
        .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border: 1px solid #e0f2fe; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        html.dark .glass-card { background: rgba(15,23,42,0.9); border: 1px solid #1e293b; color: #f1f5f9; }
        .glass-card:hover { transform: translateY(-4px); }
        html.dark .glass-card:hover { border-color: #3395ff; box-shadow: 0 10px 30px -5px rgba(51,149,255,0.2); }
    </style>
</head>
<body class="bg-brand-50 text-slate-900 dark:bg-dark-bg transition-colors duration-300 relative flex flex-col min-h-screen">

    <div id="canvas-container"></div>

    <main class="relative z-10 pt-24 pb-20 w-full px-4 md:px-6 flex-1 max-w-7xl mx-auto">
        <div id="breadcrumbs" class="hidden mb-6 px-2 flex items-center text-xs md:text-sm font-medium text-slate-500 dark:text-slate-400 flex-wrap">
            <span class="hover:text-brand-400 cursor-pointer" onclick="window.portalApp.goHome()">Home</span>
            <span class="mx-2">/</span>
            <span id="bc-institute" class="hover:text-brand-400 cursor-pointer text-brand-600 dark:text-brand-400 font-bold">Institute</span>
            <span id="bc-slash-1" class="mx-2 hidden">/</span>
            <span id="bc-year" class="hover:text-brand-400 cursor-pointer text-slate-900 dark:text-white hidden">Year</span>
        </div>

        <div id="app-container">
            <div id="view-institutes" class="animate-fade-in">
                <div class="text-center mb-10 mt-4">
                    <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-3 text-slate-900 dark:text-white">Select Your <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-accent-yellow">Institute</span></h1>
                    <p class="text-slate-500 dark:text-slate-400 text-sm md:text-lg">Access PYQs for AIIMS.</p>
                </div>
                <div id="institutes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6"></div>
            </div>

            <div id="view-years" class="hidden animate-fade-in">
                <div class="text-center mb-10 mt-4">
                    <h2 class="text-2xl md:text-3xl font-bold mb-2 text-slate-900 dark:text-white">Select Year</h2>
                    <p id="selected-institute-name" class="text-brand-500 dark:text-brand-400 font-semibold text-lg"></p>
                </div>
                <div id="years-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6"></div>
            </div>

            <div id="view-subjects" class="hidden animate-fade-in">
                <div class="text-center mb-10 mt-4">
                    <h2 class="text-2xl md:text-3xl font-bold mb-2 text-slate-900 dark:text-white">Select Subject</h2>
                    <p class="text-slate-500 dark:text-slate-400"><span id="selected-year-name" class="font-bold text-brand-500"></span> • <span id="selected-inst-sub-name"></span></p>
                </div>
                <div id="subjects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"></div>
            </div>

            <div id="view-resources" class="hidden animate-fade-in">
                <div class="text-center mb-10 mt-4">
                    <h2 class="text-2xl md:text-3xl font-bold mb-2 text-slate-900 dark:text-white">Select Resource</h2>
                    <p id="selected-resource-subject" class="text-brand-500 font-semibold text-lg"></p>
                </div>
                <div id="resources-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 max-w-4xl mx-auto"></div>
            </div>
        </div>
    </main>

    <footer class="w-full border-t border-brand-100 dark:border-slate-800 mt-auto py-8 bg-white dark:bg-dark-surface relative z-10">
        <div class="max-w-7xl mx-auto px-4 md:px-6 flex justify-between items-center text-sm text-slate-500 dark:text-slate-400">
            <div>&copy; 2026 MBBS Profs Prep. All rights reserved.</div>
        </div>
    </footer>

    <!-- VIP PDF LIBRARY DRAWER -->
    <button id="pdf-trigger-btn" type="button" onclick="window.pdfSmartApp.toggle()" style="display:none" class="fixed bottom-6 left-6 z-[9990] w-14 h-14 bg-indigo-600 text-white rounded-full shadow-2xl flex items-center justify-center border-2 border-white dark:border-slate-800 cursor-pointer">
        <span class="text-2xl">📚</span>
    </button>
    <aside id="pdf-smart-drawer" class="fixed top-0 left-0 h-full z-[10000] bg-white dark:bg-slate-950 shadow-2xl transform -translate-x-full transition-all duration-300 flex flex-col border-r border-slate-200 dark:border-slate-800 w-full md:w-[400px]">
        <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-900 shrink-0">
            <div class="flex items-center gap-3">
                <button type="button" onclick="window.pdfSmartApp.goBack()" class="p-2 -ml-2 rounded-full hover:bg-slate-200 text-slate-600 dark:text-slate-300 bg-transparent border-none cursor-pointer">←</button>
                <h2 id="pdf-smart-title" class="text-sm font-bold uppercase tracking-wider text-slate-900 dark:text-white m-0">Library</h2>
            </div>
            <button type="button" onclick="window.pdfSmartApp.close()" class="p-2 text-slate-400 hover:text-red-500 bg-transparent border-none cursor-pointer text-lg">✕</button>
        </div>
        <div id="pdf-smart-body" class="flex-1 overflow-y-auto bg-slate-100 dark:bg-slate-950 p-3"></div>
    </aside>
    <div id="pdf-smart-backdrop" onclick="window.pdfSmartApp.close()" class="fixed inset-0 z-[9995] bg-slate-900/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 md:hidden"></div>

    <!-- SUBJECT VERSION MODAL -->
    <div id="subjectVersionModal" onclick="if(event.target===this) window.closeSubjectVersionModal()" class="fixed inset-0 z-[20000] bg-slate-900/70 backdrop-blur-sm hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div id="subjectVersionCard" class="bg-white dark:bg-slate-900 rounded-3xl p-6 w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-300 border border-slate-200 dark:border-slate-700">
            <h3 id="subjectVersionTitle" class="text-xl font-black text-slate-900 dark:text-white mb-4">📚 Select Version</h3>
            <div id="subjectVersionOptions" class="space-y-3"></div>
            <button type="button" onclick="window.closeSubjectVersionModal()" class="w-full mt-4 p-3 rounded-xl bg-slate-200 dark:bg-slate-800 font-bold text-slate-600 dark:text-slate-300 border-none cursor-pointer">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { bootPortalEngine } from "./js/portal-engine.js";
        bootPortalEngine();
    </script>
</body>
</html>
