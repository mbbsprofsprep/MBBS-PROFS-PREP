<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="dynamic-page-title">MBBS PROFS PREP - OPHTHAL Clinical Cases</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { 
                        brand: { 50:'#f0f9ff', 100:'#e0f2fe', 200:'#bae6fd', 400:'#3395ff', 500:'#0ea5e9', 600:'#0284c7', 900:'#0c4a6e' }, 
                        accent: { yellow: '#ffc107', yellowHover: '#e0a800' }, 
                        dark: { bg: '#020617', surface: '#0f172a', border: '#1e293b' } 
                    }, 
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out forwards' },

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden;}
        body { background-color: #f0f9ff; color: #0f172a; transition: background-color 0.3s ease, color 0.3s ease; }
        html.dark body { background-color: #020617 !important; color: #f8fafc !important; }
        
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid #e0f2fe; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        html.dark .glass-card { background: rgba(15, 23, 42, 0.9); border: 1px solid #1e293b; color: #f1f5f9; }

        .table-container::-webkit-scrollbar, .multiselect-menu::-webkit-scrollbar { height: 8px; width: 8px; }
        .table-container::-webkit-scrollbar-thumb, .multiselect-menu::-webkit-scrollbar-thumb { background-color: #bae6fd; border-radius: 10px; }
        .table-container::-webkit-scrollbar-track, .multiselect-menu::-webkit-scrollbar-track { background: transparent; }
        html.dark .table-container::-webkit-scrollbar-thumb, html.dark .multiselect-menu::-webkit-scrollbar-thumb { background: #334155; border: 2px solid #020617; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        html.dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }

        .theory-question { font-style: italic; color: #0284c7; font-weight: 500; background-color: #f0f9ff; padding: 16px; border-radius: 8px; border-left: 4px solid #3395ff; line-height: 1.6; }
        html.dark .theory-question { background-color: rgba(15, 23, 42, 0.8); color: #bae6fd; border-left-color: #0ea5e9; }
        
        .multiselect-container { position: relative; }
        .multiselect-btn { text-align: left; width: 100%; background-color: white; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.75rem 1rem; font-size: 0.875rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        html.dark .multiselect-btn { background-color: #0f172a; border-color: #1e293b; color: #e5e7eb; }
        .multiselect-btn:hover { border-color: #3395ff; }
        
        .multiselect-menu { display: none; position: absolute; z-index: 50; top: 100%; left: 0; right: 0; margin-top: 0.25rem; background-color: white; border: 1px solid #e2e8f0; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); max-height: 300px; overflow-y: auto; }
        .multiselect-menu.show { display: block; }
        html.dark .multiselect-menu { background-color: #0f172a; border-color: #1e293b; }

        .multiselect-option { padding: 0.5rem 1rem; cursor: pointer; display: flex; align-items: center; font-size: 0.875rem; color: #334155; }
        html.dark .multiselect-option { color: #cbd5e1; }
        .multiselect-option:hover { background-color: #f0f9ff; }
        html.dark .multiselect-option:hover { background-color: #1e293b; }
        .multiselect-option input[type="checkbox"] { margin-right: 0.75rem; width: 1rem; height: 1rem; accent-color: #3395ff; }
        
        #summaryButton { font-size: 1.5rem; padding: 4px 8px; background-color: transparent; border: none; cursor: pointer; transition: transform 0.3s ease; }
        #summaryButton:hover { transform: scale(1.2); }

        /* --- DECK VIEW CSS --- */
        #universal-deck-layer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #f8fafc; z-index: 9990; flex-direction: column; font-family: 'Plus Jakarta Sans', sans-serif; }
        html.dark #universal-deck-layer { background: #020617; color: white; }
        .deck-card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); height: 100%; overflow-y: auto; display: flex; flex-direction: column; }
        html.dark .deck-card { background: #0f172a; border: 1px solid #1e293b; }
        
        .deck-option-btn { width: 100%; padding: 16px; margin-bottom: 12px; border: 2px solid #e2e8f0; border-radius: 12px; text-align: left; transition: all 0.2s; font-weight: 500; color: #334155; cursor: pointer; position: relative; }
        html.dark .deck-option-btn { border-color: #1e293b; background: rgba(30, 41, 59, 0.5); color: #cbd5e1; }
        .deck-opt-correct { border-color: #22c55e !important; background: #f0fdf4 !important; color: #15803d !important; font-weight: 600; opacity: 1 !important; }
        html.dark .deck-opt-correct { background: rgba(34, 197, 94, 0.15) !important; color: #4ade80 !important; border-color: #16a34a !important; }
        .deck-opt-wrong { border-color: #ef4444 !important; background: #fef2f2 !important; color: #b91c1c !important; font-weight: 600; opacity: 0.7; }
        html.dark .deck-opt-wrong { background: rgba(239, 68, 68, 0.15) !important; color: #f87171 !important; border-color: #dc2626 !important; }
        
        #view-toggle-btn { position: fixed; bottom: 24px; right: 24px; z-index: 10000; width: 60px; height: 60px; border-radius: 50%; background: #0ea5e9; color: white; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 28px; transition: transform 0.2s; }
        #view-toggle-btn:active { transform: scale(0.90); }
        
        .deck-drawer { position: fixed; inset: 0; z-index: 10001; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; }
        .deck-drawer.open { pointer-events: auto; opacity: 1; }
        .deck-drawer-bg { position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
        .deck-drawer-content { position: absolute; top: 0; right: 0; bottom: 0; width: 85%; max-width: 320px; background: white; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
        html.dark .deck-drawer-content { background: #0f172a; border-left: 1px solid #1e293b; }
        .deck-drawer.open .deck-drawer-content { transform: translateX(0); }
        
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 16px; overflow-y: auto; }
        .deck-nav-btn { aspect-ratio: 1; border-radius: 8px; font-weight: 600; font-size: 13px; background: #f3f4f6; color: #1e293b; border: 1px solid #cbd5e1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        html.dark .deck-nav-btn { background: #1e293b; color: #f1f5f9; border-color: #334155; }
        .deck-nav-btn.active { background: #0ea5e9 !important; color: white !important; border-color: #0ea5e9 !important; }
        .deck-nav-btn.correct { background: #22c55e; color: white; border-color: #16a34a; }
        .deck-nav-btn.wrong { background: #ef4444; color: white; border-color: #dc2626; }

        /* --- STYLED MARKDOWN RENDER CLASSES --- */
        .markdown-body { font-size: 0.9rem; line-height: 1.6; color: inherit; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 800; margin-top: 1.5em; margin-bottom: 0.5em; color: #0284c7; }
        html.dark .markdown-body h1, html.dark .markdown-body h2, html.dark .markdown-body h3 { color: #38bdf8; }
        .markdown-body p { margin-bottom: 1em; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5em; margin-bottom: 1em; }
        .markdown-body ol { list-style-type: decimal; margin-left: 1.5em; margin-bottom: 1em; }
        .markdown-body strong { font-weight: 800; color: #0f172a; }
        html.dark .markdown-body strong { color: #f8fafc; }
        .markdown-body img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1rem 0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0; }
        html.dark .markdown-body img { border-color: #334155; }
    </style>
</head>

    <script>
        // --- CONSTANTS & GLOBALS ---
        window.SECRET_CODE = "777pankaj";
        window.optionLetters = ['A', 'B', 'C', 'D', 'E'];
        window.motivationalMessages = ["Hi [Name]! You are bringing life to your studies!", "Hey [Name], every expert was once a beginner. Keep pushing.", "Take a deep breath, [Name]. You are doing amazing work!"];

        window.globalUserStatus = { isVIP: false, daysLeft: 0, validUntil: null, expired: false };
        window.currentUserObj = null;
        window.accessLevel = 'guest'; 
        window.filterState = { types: new Set(), chapters: new Set(), exams: new Set() };
        window.isDataLoaded = false;
        window.userBookmarks = {}; 
        window.initialViewConfigured = false;
        window.liveAnswers = {};
        window.globalPlatformSettings = { showAnswers: false };

        // ====================================================================
        // 🔴 MASTER ROUTING CONTROLS
        // ====================================================================
        const urlParams = new URLSearchParams(window.location.search);
        window.COLLEGE_CODE = urlParams.get('college') || 'deoghar'; 
        window.COLLEGE_NAME = "AIIMS " + window.COLLEGE_CODE.replace(/-/g, ' ').toUpperCase();
        
        // 🟢 SETTING TO OPHTHAL
        window.SUBJECT_CODE = "OPHTHAL"; 
        
        window.curriculumData = [];
        window.qnaData = [];
        window.displayData = [];

        document.addEventListener("DOMContentLoaded", () => {
            const titleEl = document.getElementById('dynamic-page-title');
            if (titleEl) titleEl.innerText = `MBBS PROFS PREP - ${window.SUBJECT_CODE} Clinical Cases (${window.COLLEGE_NAME})`;
            
            const mainTitleEl = document.getElementById('dynamic-subject-title');
            if (mainTitleEl) mainTitleEl.innerText = `${window.SUBJECT_CODE} Clinical Cases`;

            const headerEl = document.getElementById('dynamic-college-header');
            if (headerEl) headerEl.innerText = window.COLLEGE_NAME + " | Professional Examinations";
        });

        // --- UNIQUE ID GENERATOR ---
        window.getUniqueQuestionId = function(qId) {
            const rawId = `${window.COLLEGE_NAME}_${window.SUBJECT_CODE}_CLINICAL_${qId}`;
            return rawId.replace(/[\.#$\[\]]/g, '').replace(/\s+/g, '_');
        };

        // --- MARKDOWN RENDERER ---
        window.renderMarkdown = function(text) {
            if (!text) return "<em class='text-slate-400'>No explanation provided yet.</em>";
            
            let processedText = text;
            const ytMarkdownRegex = /\[([^\]]+)\]\((?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?|shorts)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})[^\)]*\)/g;
            processedText = processedText.replace(ytMarkdownRegex, (match, title, videoId) => {
                const uniqueId = 'yt-' + Math.random().toString(36).substring(2, 11);
                return `<div class="yt-container my-4">

        window.getUniqueValues = function(key) {
            const values = new Set();
            window.qnaData.forEach(item => { 
                if (key === 'type' && item.type) { values.add(item.type); } 
                else if (key === 'chapter' && item.chapter) {
                    if (Array.isArray(item.chapter)) { item.chapter.forEach(e => values.add(e)); } 
                    else { values.add(item.chapter); }
                }
                else if (key === 'exam' && item.examBatch) {
                    if (Array.isArray(item.examBatch)) { item.examBatch.forEach(e => values.add(e)); } 
                    else { values.add(item.examBatch); }
                } else if (item[key]) { values.add(item[key]); }
            });
            return Array.from(values).sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }));
        }

        window.filterTable = function() {
            const searchText = document.getElementById("searchInput").value.toLowerCase();
            const table = document.getElementById("qnaTable");
            if(!table) return;
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                if (tr[i].getAttribute('data-locked-row') === "true") { tr[i].style.display = ""; continue; }
                const dataIndex = tr[i].getAttribute('data-index'); 
                const item = window.displayData[dataIndex];
                if(!item) continue;

                let showRow = true;
                if (searchText) {
                    let rowText = (tr[i].cells[1].textContent || "") + (tr[i].cells[3].textContent || "");
                    if (rowText.toLowerCase().indexOf(searchText) === -1) showRow = false;
                }
                
                if (showRow && window.filterState.types.size > 0 && !window.filterState.types.has(item.type)) showRow = false;
                
                if (showRow && window.filterState.chapters.size > 0) {
                    const chArray = Array.isArray(item.chapter) ? item.chapter : [item.chapter];
                    if(!chArray.some(ch => window.filterState.chapters.has(ch))) showRow = false;
                }
                
                if (showRow && window.filterState.exams.size > 0) {
                    let hasExamMatch = false;
                    if (Array.isArray(item.examBatch)) {
                        hasExamMatch = item.examBatch.some(e => window.filterState.exams.has(e));
                    } else {
                        hasExamMatch = window.filterState.exams.has(item.examBatch);
                    }
                    if (!hasExamMatch) showRow = false;
                }

                tr[i].style.display = showRow ? "" : "none";
            }
        }

                btn.innerText = "Published! ✅";
                
                setTimeout(() => {
                    btn.classList.replace('bg-green-500', 'bg-brand-500');
                    btn.innerText = originalText;
                    btn.disabled = false;
                    btn.classList.remove('opacity-75');
                    
                    document.getElementById('clin-q-stem').value = '';
                    document.getElementById('clin-q-ans').value = '';
                    document.getElementById('uploadClinicalModal').classList.add('hidden');
                }, 1500);

            } catch (error) {
                alert("Upload Failed: " + error.message);
                btn.innerText = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        };

        // --- UNIFIED SAVE FUNCTION FOR ADMIN ANSWERS (Edits) ---
        window.saveAdminAnswer = async function(qId, btn, context) {
            const elId = context === 'modal' ? `admin-ans-modal-${qId}` : `admin-ans-deck-${qId}`;
            const text = document.getElementById(elId).value.trim();
            const originalText = btn.innerText;
            
            if (!text && !confirm("This will delete the current answer. Continue?")) return;

            btn.innerText = "Publishing...";
            btn.disabled = true;
            btn.classList.add('opacity-75');

            try {
                const answerRef = ref(window.db, `clinical_data/${window.COLLEGE_CODE}/${window.SUBJECT_CODE}/${qId}/answer`);
                
                if (text) {
                    await set(answerRef, text);
                    btn.classList.replace('bg-brand-500', 'bg-green-500');
                    btn.innerText = "Published! ✅";
                } else {
                    await remove(answerRef);
                    btn.classList.replace('bg-brand-500', 'bg-slate-500');
                    btn.innerText = "Removed 🗑️";
                }

                setTimeout(() => {
                    btn.classList.remove('bg-green-500', 'bg-slate-500');
                    btn.classList.add('bg-brand-500');
                    btn.innerText = originalText;
                    btn.disabled = false;
                    btn.classList.remove('opacity-75');
                    
                    if (context === 'deck') window.renderDeckCard();
                }, 2000);

            } catch(e) {
                console.error("Save error:", e);
                alert("Failed to publish: " + e.message);
                btn.innerText = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        };

        window.executeBookmarkToggle = async function(uniqueId, bookmarkData, isSaved) {
            try {
                const dbRef = ref(db, `users/${window.currentUserObj.uid}/bookmarks/${uniqueId}`);
                if (isSaved) {
                    await remove(dbRef);
                    if (window.showModal) window.showModal("Removed", `<p class="text-sm text-slate-500 dark:text-slate-400">Question removed from your cloud bookmarks.</p>`, `<button onclick="window.closeModal()" class="w-full py-2 bg-slate-200 dark:bg-slate-800 rounded-lg font-bold text-slate-700 dark:text-slate-300 border-none">Close</button>`, `🗑️`);
                } else {
                    await set(dbRef, bookmarkData);
                    if (window.showModal) window.showModal("Cloud Synced!", `<p class="text-sm text-slate-500 dark:text-slate-400">Question saved to your account. Access it from any device.</p>`, `<button onclick="window.closeModal()" class="w-full py-2 bg-brand-500 text-white rounded-lg font-bold border-none">Awesome</button>`, `☁️`);
                }
            } catch (e) {
                console.error(e);
                alert("Error syncing bookmark: " + e.message);
            }
        };

        window.saveEditedProfile = async function(btn) {
            const name = document.getElementById('edit-name').value.trim(); const joinYear = document.getElementById('edit-join-year').value; const college = document.getElementById('edit-college').value.trim(); const city = document.getElementById('edit-city').value.trim(); const phone = document.getElementById('edit-phone').value.trim();
            if (!name) return alert("Name is required!");
            const originalText = btn.innerText; btn.disabled = true; btn.innerText = "Saving...";
            try {
                await update(ref(db, 'users/' + window.currentUserObj.uid + '/profile'), { fullName: name, joinYear: joinYear, college: college, city: city, phone: phone });
                if (window.currentUserObj.displayName !== name) { await updateProfile(window.currentUserObj, { displayName: name }); }
                btn.innerText = "Saved!"; btn.classList.replace('bg-brand-500', 'bg-green-500');
                setTimeout(() => { btn.innerText = originalText; btn.classList.replace('bg-green-500', 'bg-brand-500'); btn.disabled = false; window.userPanelApp.setView('menu'); }, 1000);
            } catch(e) { alert(e.message); btn.disabled = false; btn.innerText = originalText; }
        };

        window.handleEmailLogin = (btn) => {
            const e = document.getElementById('login-email').value; const p = document.getElementById('login-pass').value;
            if(!e || !p) return window.showAuthError("Email/Pass required");
            const originalText = btn.innerText; btn.disabled = true; btn.innerText = "Verifying...";
            signInWithEmailAndPassword(auth, e, p).catch(err => { btn.disabled = false; btn.innerText = originalText; window.showAuthError(err.message); });
        };

        window.handleEmailSignUp = async (btn) => {
            const n = document.getElementById('reg-name').value; const e = document.getElementById('reg-email').value; const p = document.getElementById('reg-pass').value; const j = document.getElementById('reg-join-year').value; const c = document.getElementById('reg-college').value; const cy = document.getElementById('reg-country') ? document.getElementById('reg-country').value : "India"; const city = document.getElementById('reg-city').value; const phone = document.getElementById('reg-phone').value;
            if(!n || !e || !p || !c || !cy || !j) return window.showAuthError("Please fill all mandatory fields.");
            if(p.length < 6) return window.showAuthError("Password must be at least 6 characters.");
            const originalText = btn.innerText; btn.disabled = true; btn.innerText = "Creating Profile...";
            try {
                const uc = await createUserWithEmailAndPassword(auth, e, p);
                await updateProfile(uc.user, { displayName: n });
                await set(ref(db, 'users/' + uc.user.uid + '/profile'), { fullName: n, email: e, joinYear: j, college: c, country: cy, city: city || "Not provided", phone: phone || "Not provided", createdAt: new Date().toISOString() });
            } catch(err) { btn.disabled = false; btn.innerText = originalText; window.showAuthError(err.message); }
        };

        window.handleForgotPass = () => {
            const e = document.getElementById('login-email').value;
            if(!e) return window.showAuthError("Enter email first");
            sendPasswordResetEmail(auth, e).then(() => {
                const errDiv = document.getElementById('auth-error-msg'); errDiv.innerText = "Reset link sent! Check your inbox."; errDiv.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'border-red-200'); errDiv.classList.add('bg-green-50', 'text-green-600', 'border-green-200');
            }).catch(err => window.showAuthError(err.message));
        };

        window.firebaseSignOut = () => signOut(auth).then(() => window.location.reload());

        onAuthStateChanged(auth, (user) => {
            window.currentUserObj = user;
            
            const coffeeBtn = document.getElementById('summaryButton');
            const adminControls = document.getElementById('admin-controls');
            const uploadBtn = document.getElementById('admin-upload-btn'); 

            if (user) {
                const email = user.email.toLowerCase().trim();
                const isAdmin = allowedVIPs.includes(email);
                
                if (coffeeBtn) coffeeBtn.style.display = isAdmin ? 'inline-block' : 'none';
                if (adminControls) { adminControls.classList.toggle('hidden', !isAdmin); adminControls.classList.toggle('flex', isAdmin); }
                if (uploadBtn) uploadBtn.classList.toggle('hidden', !isAdmin); 

                // --- LISTEN FOR GLOBAL SETTINGS ---
                const settingsRef = ref(db, `settings/${window.COLLEGE_CODE}/${window.SUBJECT_CODE}_CLINICAL`);
                onValue(settingsRef, (snapshot) => {
                    const data = snapshot.val();
                    window.globalPlatformSettings.showAnswers = data ? data.showAnswers : false;
                    
                    const toggleEl = document.getElementById('global-answer-toggle');
                    if (toggleEl) toggleEl.checked = window.globalPlatformSettings.showAnswers;
                    
                    if (window.displayData && window.displayData.length > 0) {
                        window.populateTable();
                        if (window.isDeckMode) window.renderDeckCard();
                    }
                });

                // --- FETCH CLINICAL QUESTIONS FROM FIREBASE ---
                const clinRef = ref(db, `clinical_data/${window.COLLEGE_CODE}/${window.SUBJECT_CODE}`);
                onValue(clinRef, (snapshot) => {
                    const data = snapshot.val() || {};
                    
                    window.qnaData = Object.keys(data).map(key => {
                        return {
                            q: key, 
                            stem: data[key].stem,
                            chapter: [data[key].chapter],
                            type: data[key].type,
                            examBatch: "Clinical Wards",
                            ans_key: "" 
                        };
                    }).reverse(); 

                    window.liveAnswers = {};
                    Object.keys(data).forEach(key => {
                        if (data[key].answer) {
                            window.liveAnswers[key] = { text: data[key].answer };
                        }
                    });

                    if(typeof window.processDataForAccess === 'function') window.processDataForAccess();
                });

                onValue(ref(db, 'users/' + user.uid + '/profile'), (s) => { 
                    window.currentUserProfileData = s.val() || {}; 
                    if(window.userPanelApp && window.userPanelApp.isOpen && window.userPanelApp.viewMode !== 'bookmarks') window.userPanelApp.renderState(); 
                });
                
                onValue(ref(db, 'users/' + user.uid + '/bookmarks'), (snapshot) => { 
                    window.userBookmarks = snapshot.exists() ? snapshot.val() : {}; 
                    if(typeof window.updateBookmarkUI === 'function') window.updateBookmarkUI();
                    if(window.userPanelApp && window.userPanelApp.isOpen && window.userPanelApp.viewMode === 'bookmarks') window.userPanelApp.renderState(); 
                });

                if (isAdmin) {
                    window.globalUserStatus = { isVIP: true, daysLeft: 999, validUntil: 'Lifetime Access', expired: false };
                    window.accessLevel = 'premium';
                    if(window.userPanelApp && window.userPanelApp.isOpen && window.userPanelApp.viewMode === 'menu') window.userPanelApp.renderState();
                } else {
                    onValue(ref(db, 'users/' + user.uid + '/subscription'), (s) => {
                        let sub = { isVIP: false, daysLeft: 0, validUntil: null, expired: false };
                        if (s.exists()) {
                            const d = s.val(); const today = new Date(); today.setHours(0,0,0,0); const exp = new Date(d.validUntil); exp.setHours(0,0,0,0);
                            const diff = Math.ceil((exp - today) / 86400000);
                            if (diff >= 0 && d.status === "active") sub = { isVIP: true, daysLeft: diff, validUntil: d.validUntil, expired: false };
                            else sub = { isVIP: false, daysLeft: diff, validUntil: d.validUntil, expired: true };
                        }
                        window.globalUserStatus = sub; 
                        window.accessLevel = sub.isVIP ? 'premium' : 'free';
                        if(window.userPanelApp && window.userPanelApp.isOpen && window.userPanelApp.viewMode === 'menu') window.userPanelApp.renderState();
                    });
                }
            } else { 
                if (coffeeBtn) coffeeBtn.style.display = 'none';
                if (adminControls) { adminControls.classList.add('hidden'); adminControls.classList.remove('flex'); }
                if (uploadBtn) uploadBtn.classList.add('hidden'); 

                window.currentUserProfileData = {}; 
                window.userBookmarks = {}; 
                window.globalUserStatus = { isVIP: false, daysLeft: 0 }; 
                window.accessLevel = 'guest';
                
                if(window.userPanelApp && window.userPanelApp.isOpen) window.userPanelApp.renderState(); 
            }
        });

    </script>
</body>
</html>
